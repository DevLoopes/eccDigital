services:
  postgres-db:
    container_name: my_postgres
    image: postgres:15-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - sifr-network
    volumes:
        - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready',
          '-U',
          '${POSTGRES_USER}',
          '-d',
          '${POSTGRES_DB}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: 
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sifr-api
    env_file:
      - .env
    ports:
      - "${API_PORT}:${API_PORT}"
    environment:
      API_PORT: '${API_PORT}'
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - sifr-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

